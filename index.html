<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/abc-logo-master.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <!-- First-load preloader: inline so it paints before any JS or CSS
         arrives. Removed by src/lib/preloader.ts once the page is ready;
         the failsafe animation fades it out on its own if JS never runs. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f1ea;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.6s;
        animation: preloader-failsafe 0.6s ease 8s forwards;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #preloader svg {
        width: 120px;
        height: 120px;
        overflow: visible;
      }
      #preloader .runner {
        animation: preloader-run 1.2s linear infinite;
      }
      #preloader p {
        margin: 0;
        font: 600 10px/1 "Inter", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.35em;
        color: #3e3e3e;
        opacity: 0.55;
      }
      @keyframes preloader-run {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -256.59; }
      }
      @keyframes preloader-failsafe {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .runner { animation-duration: 3.6s; }
        #preloader .runner:nth-of-type(3) { animation-delay: -1.2s !important; }
        #preloader .runner:nth-of-type(4) { animation-delay: -2.4s !important; }
      }
    </style>
    <!--ssr-head-->
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading">
      <!-- Three brand-colour runners (navy, gold, light gold) chase each
           other round a faint infinity track — each a single dash, kept a
           third of a loop apart by staggered animation delays. Path
           length is 256.59. -->
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <path id="preloader-path" d="M24.3 30C11.4 30 5 43.3 5 50s6.4 20 19.3 20c19.3 0 32.1-40 51.4-40 C88.6 30 95 43.3 95 50s-6.4 20-19.3 20C56.4 70 43.6 30 24.3 30z" />
        </defs>
        <use href="#preloader-path" fill="none" stroke="#262970" stroke-opacity="0.08" stroke-width="8" />
        <use class="runner" href="#preloader-path" fill="none" stroke="#262970" stroke-width="8" stroke-linecap="round" stroke-dasharray="42.76 213.83" />
        <use class="runner" href="#preloader-path" fill="none" stroke="#9f732c" stroke-width="8" stroke-linecap="round" stroke-dasharray="42.76 213.83" style="animation-delay: -0.4s" />
        <use class="runner" href="#preloader-path" fill="none" stroke="#c79a5c" stroke-width="8" stroke-linecap="round" stroke-dasharray="42.76 213.83" style="animation-delay: -0.8s" />
      </svg>
      <p>IDEAS &bull; MEDIA &bull; IMPACT</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
